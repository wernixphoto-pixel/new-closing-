<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closing YouTube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%}
body{display:flex;justify-content:center;align-items:center;overflow:hidden;background:#000;font-family:Segoe UI,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;opacity:0;background:
radial-gradient(circle at center,#141414 0%,#070707 45%,#000 100%),
radial-gradient(circle,rgba(255,255,255,.03),transparent 70%);
animation:bgFade 5s ease forwards 2s,bgPulse 8s ease-in-out infinite 7s}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.35) 100%)}
.container{text-align:center;animation:breath 8s ease-in-out infinite 8s}
.title,.subtitle{position:relative;display:inline-block;overflow:hidden;color:#fff;white-space:nowrap;opacity:0}
.title{font-size:clamp(32px,4vw,60px);font-weight:600;letter-spacing:.18em;
animation:titleIn 1s ease forwards 7s,glowT 6s ease-in-out infinite 8s}
.subtitle{display:block;margin-top:16px;font-size:clamp(12px,1.2vw,20px);letter-spacing:.35em;
animation:subIn 1s ease forwards 7.4s,glowS 6s ease-in-out infinite 8.4s}
.title::after,.subtitle::after{content:"";position:absolute;top:-60%;left:-220%;width:42%;height:220%;transform:skewX(-25deg);
background:linear-gradient(90deg,rgba(255,255,255,0)0%,rgba(255,255,255,.02)15%,rgba(255,255,255,.08)30%,rgba(255,255,255,.22)42%,rgba(255,255,255,.95)50%,rgba(255,255,255,.22)58%,rgba(255,255,255,.08)70%,rgba(255,255,255,.02)85%,rgba(255,255,255,0)100%);
filter:blur(10px)}
.title::after{animation:shimmer 24s linear infinite 10s}
.subtitle::after{animation:shimmer 24s linear infinite 10.7s}
@keyframes bgFade{from{opacity:0}to{opacity:1}}
@keyframes bgPulse{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.05);opacity:.7}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.005)}}
@keyframes titleIn{from{opacity:0;transform:translateY(20px);letter-spacing:.4em}to{opacity:1;transform:none;letter-spacing:.18em}}
@keyframes subIn{from{opacity:0;transform:translateY(15px);letter-spacing:.6em}to{opacity:1;transform:none;letter-spacing:.35em}}
@keyframes glowT{0%,100%{text-shadow:0 0 6px rgba(255,255,255,.06)}50%{text-shadow:0 0 12px rgba(255,255,255,.18),0 0 25px rgba(255,255,255,.08)}}
@keyframes glowS{0%,100%{text-shadow:0 0 3px rgba(255,255,255,.05)}50%{text-shadow:0 0 10px rgba(255,255,255,.15)}}
@keyframes shimmer{0%{left:-220%;opacity:0}8%{opacity:1}28%{left:220%;opacity:0}100%{left:220%;opacity:0}}
</style></head>
<body><div class="container"><div class="title">TERIMA KASIH</div><div class="subtitle">SUDAH MENONTON</div></div></body></html>
