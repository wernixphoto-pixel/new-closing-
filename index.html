<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Closing Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:rgba(0,0,0,0);
    font-family:"Segoe UI",Arial,sans-serif;
    animation:fadeBody 5s ease forwards;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    opacity:0;
    background:radial-gradient(circle at center,#151515,#050505 55%,#000);
    animation:bgfade 5s ease forwards,bgpulse 8s ease-in-out infinite 6s;
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.35));
    pointer-events:none;
}

.wrap{
    text-align:center;
    animation:breath 8s ease-in-out infinite 6s;
}

h1,
p{
    color:#fff;
    position:relative;
    display:inline-block;
    overflow:hidden;
}

h1{
    font-size:clamp(34px,4vw,62px);
    letter-spacing:.18em;
    opacity:0;
    animation:
        in1 1.2s ease forwards 4s,
        glow1 6s ease-in-out infinite 5.5s;
}

p{
    display:block;
    margin-top:3px;
    font-size:clamp(13px,1.2vw,20px);
    letter-spacing:.35em;
    opacity:0;
    animation:
        in2 1.2s ease forwards 4.3s,
        glow2 6s ease-in-out infinite 5.8s;
}

.shimmer:after{
    content:"";
    position:absolute;
    top:-20%;
    bottom:-20%;
    left:-15%;
    width:9%;
    transform:skewX(-20deg);
    background:linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.20),
        rgba(255,255,255,.95),
        rgba(255,255,255,.20),
        rgba(255,255,255,0)
    );
    filter:blur(2px);
    animation:sweep 1s ease-in-out forwards;
}

@keyframes fadeBody{
    from{
        background:rgba(0,0,0,0);
    }
    to{
        background:rgba(0,0,0,1);
    }
}

@keyframes bgfade{
    to{
        opacity:1;
    }
}

@keyframes bgpulse{
    50%{
        transform:scale(1.05);
        opacity:.7;
    }
}

@keyframes breath{
    50%{
        transform:scale(1.005);
    }
}

@keyframes in1{
    from{
        opacity:0;
        transform:translateY(24px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes in2{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes glow1{
    50%{
        text-shadow:0 0 12px rgba(255,255,255,.18);
    }
}

@keyframes glow2{
    50%{
        text-shadow:0 0 8px rgba(255,255,255,.15);
    }
}

@keyframes sweep{
    0%{
        left:-15%;
        opacity:0;
    }
    25%{
        opacity:1;
    }
    100%{
        left:106%;
        opacity:0;
    }
}
</style>

</head>
<body>

<div class="wrap">
    <h1 id="t">TERIMA KASIH</h1>
    <p id="s">SUDAH MENONTON</p>
</div>

<script>
function shimmer(){

    ["t","s"].forEach((id,i)=>{

        setTimeout(()=>{

            const e=document.getElementById(id);

            e.classList.remove("shimmer");
            void e.offsetWidth;
            e.classList.add("shimmer");

        },i*250);

    });

    const next=20000+Math.random()*15000;
    setTimeout(shimmer,next);

}

/* Shimmer pertama setelah teks tampil */
setTimeout(shimmer,6000);

</script>

</body>
</html>
