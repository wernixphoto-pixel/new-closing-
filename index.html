<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closing Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%}
body{display:flex;justify-content:center;align-items:center;overflow:hidden;background:#000;font-family:Segoe UI,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;opacity:0;background:
radial-gradient(circle at center,#151515,#050505 55%,#000);
animation:bgfade 5s ease forwards 2s,bgpulse 8s ease-in-out infinite 7s}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
.wrap{animation:breath 8s ease-in-out infinite 8s;text-align:center}
h1,p{color:#fff;position:relative;display:inline-block;overflow:hidden}
h1{font-size:clamp(34px,4vw,62px);letter-spacing:.18em;opacity:0;animation:in1 1s ease forwards 7s,glow1 6s ease-in-out infinite 8s}
p{display:block;margin-top:16px;font-size:clamp(13px,1.2vw,20px);letter-spacing:.35em;opacity:0;animation:in2 1s ease forwards 7.4s,glow2 6s ease-in-out infinite 8.4s}
.shimmer:after{content:"";position:absolute;top:-20%;bottom:-20%;left:-15%;width:9%;transform:skewX(-20deg);
background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.2),rgba(255,255,255,.95),rgba(255,255,255,.2),rgba(255,255,255,0));
filter:blur(2.5px);animation:sweep 1s ease-in-out forwards}
@keyframes sweep{0%{left:-15%;opacity:0}25%{opacity:1}100%{left:106%;opacity:0}}
@keyframes bgfade{to{opacity:1}}@keyframes bgpulse{50%{transform:scale(1.05);opacity:.7}}
@keyframes breath{50%{transform:scale(1.005)}}@keyframes in1{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
@keyframes in2{from{opacity:0;transform:translateY(15px)}to{opacity:1}}
@keyframes glow1{50%{text-shadow:0 0 12px rgba(255,255,255,.18)}}@keyframes glow2{50%{text-shadow:0 0 8px rgba(255,255,255,.15)}}
</style></head><body><div class="wrap"><h1 id="t">TERIMA KASIH</h1><p id="s">SUDAH MENONTON</p></div>
<script>
function run(){
 ["t","s"].forEach((id,i)=>{
   setTimeout(()=>{
     const e=document.getElementById(id);
     e.classList.remove("shimmer"); void e.offsetWidth; e.classList.add("shimmer");
   },i*250);
 });
 const next=20000+Math.random()*15000;
 setTimeout(run,next);
}
setTimeout(run,10000);
</script></body></html>
