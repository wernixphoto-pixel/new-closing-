<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Closing Premium</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Segoe UI",Arial,sans-serif;
}

/* ==========================
   BACKGROUND
========================== */

.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#171717,#070707 55%,#000 100%);
    opacity:0;
    animation:
        bgFade 5s ease forwards 2s,
        bgPulse 8s ease-in-out infinite 7s;
}

.vignette{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle,
        transparent 55%,
        rgba(0,0,0,.35));
    pointer-events:none;
}

/* ==========================
   CONTENT
========================== */

.wrap{
    text-align:center;
    animation:breath 8s ease-in-out infinite 8s;
}

h1,
p{
    position:relative;
    display:inline-block;
    overflow:hidden;
    color:#fff;
}

h1{

    font-size:clamp(36px,4vw,64px);
    letter-spacing:.18em;

    opacity:0;

    animation:
        textIn1 1s ease forwards 7s,
        glow1 6s ease-in-out infinite 8s;

}

p{

    display:block;

    margin-top:16px;

    font-size:clamp(14px,1.3vw,20px);

    letter-spacing:.35em;

    opacity:0;

    animation:
        textIn2 1s ease forwards 7.4s,
        glow2 6s ease-in-out infinite 8.4s;

}

/* ==========================
   SHIMMER
========================== */

.shine{

    position:absolute;

    top:-20%;
    bottom:-20%;

    left:-20%;

    width:9%;

    transform:skewX(-20deg);

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.15),
        rgba(255,255,255,.95),
        rgba(255,255,255,.15),
        transparent
    );

    filter:blur(2.5px);

    opacity:0;

    pointer-events:none;

}

.shine.play{

    animation:sweep 1s ease;

}

/* ==========================
   KEYFRAMES
========================== */

@keyframes sweep{

0%{
left:-20%;
opacity:0;
}

25%{
opacity:1;
}

100%{
left:115%;
opacity:0;
}

}

@keyframes bgFade{

to{
opacity:1;
}

}

@keyframes bgPulse{

50%{
transform:scale(1.05);
opacity:.72;
}

}

@keyframes breath{

50%{
transform:scale(1.005);
}

}

@keyframes textIn1{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes textIn2{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes glow1{

50%{
text-shadow:0 0 12px rgba(255,255,255,.18);
}

}

@keyframes glow2{

50%{
text-shadow:0 0 8px rgba(255,255,255,.15);
}

}

</style>

</head>

<body>

<div class="bg"></div>

<div class="vignette"></div>

<div class="wrap">

<h1 id="t">
TERIMA KASIH
<span class="shine"></span>
</h1>

<p id="s">
SUDAH MENONTON
<span class="shine"></span>
</p>

</div>

<script>

function playShine(id){

    const shine=document.querySelector("#"+id+" .shine");

    shine.classList.remove("play");

    void shine.offsetWidth;

    shine.classList.add("play");

    shine.addEventListener("animationend",function end(){

        shine.classList.remove("play");

        shine.removeEventListener("animationend",end);

    });

}

function runShimmer(){

    playShine("t");

    setTimeout(function(){

        playShine("s");

    },250);

    const next=20000+Math.random()*15000;

    setTimeout(runShimmer,next);

}

/* mulai setelah tulisan tampil */

setTimeout(runShimmer,10000);

</script>

</body>
</html>
