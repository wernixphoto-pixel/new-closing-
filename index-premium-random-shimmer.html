```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Closing Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:"Segoe UI",Arial,sans-serif;
}

/* ===========================
   BACKGROUND
=========================== */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at center,
        #1a1a1a 0%,
        #0a0a0a 55%,
        #000 100%);

    opacity:0;

    animation:
        bgFade 4s ease forwards 2s,
        bgPulse 8s ease-in-out infinite 6s;
}

body::after{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle,
        transparent 55%,
        rgba(0,0,0,.35));

    pointer-events:none;
}

/* ===========================
   CONTENT
=========================== */

.wrap{
    text-align:center;
    animation:breath 8s ease-in-out infinite 7s;
}

h1,
p{
    position:relative;
    display:inline-block;
    overflow:hidden;
    color:#fff;
    opacity:0;
}

h1{
    display:block;
    font-size:clamp(38px,4vw,70px);
    letter-spacing:.20em;

    animation:
        titleIn 1.2s ease forwards 6s,
        glowTitle 6s ease-in-out infinite 7.2s;
}

p{
    margin-top:18px;

    font-size:clamp(14px,1.2vw,22px);

    letter-spacing:.35em;

    animation:
        subIn 1.2s ease forwards 6.4s,
        glowSub 6s ease-in-out infinite 7.6s;
}

/* ===========================
   SHIMMER
=========================== */

.shimmer{
    position:relative;
}

.shimmer::after{

    content:"";

    position:absolute;

    top:-20%;
    bottom:-20%;
    left:-15%;

    width:9%;

    transform:skewX(-20deg);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0),
            rgba(255,255,255,.15),
            rgba(255,255,255,.95),
            rgba(255,255,255,.15),
            rgba(255,255,255,0)
        );

    filter:blur(2.5px);

    animation:shimmer 1s ease-in-out forwards;
}

/* ===========================
   KEYFRAMES
=========================== */

@keyframes shimmer{

    0%{
        left:-15%;
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        left:106%;
        opacity:0;
    }

}

@keyframes bgFade{

    to{
        opacity:1;
    }

}

@keyframes bgPulse{

    50%{
        transform:scale(1.05);
        opacity:.75;
    }

}

@keyframes breath{

    50%{
        transform:scale(1.005);
    }

}

@keyframes titleIn{

    from{
        opacity:0;
        transform:translateY(24px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes subIn{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes glowTitle{

    50%{
        text-shadow:
            0 0 10px rgba(255,255,255,.18);
    }

}

@keyframes glowSub{

    50%{
        text-shadow:
            0 0 8px rgba(255,255,255,.14);
    }

}
</style>
</head>

<body>

<div class="wrap">

    <h1 id="title">
        TERIMA KASIH
    </h1>

    <p id="subtitle">
        SUDAH MENONTON
    </p>

</div>

<script>

const items=[
    document.getElementById("title"),
    document.getElementById("subtitle")
];

function playShimmer(){

    items.forEach((el,index)=>{

        setTimeout(()=>{

            el.classList.remove("shimmer");

            void el.offsetWidth;

            el.classList.add("shimmer");

        },index*250);

    });

}

function randomLoop(){

    playShimmer();

    const delay=
        20000+
        Math.random()*15000;

    setTimeout(randomLoop,delay);

}

/* shimmer pertama */

setTimeout(randomLoop,9000);

</script>

</body>
</html>
```
