<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closing YouTube Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{display:flex;justify-content:center;align-items:center;overflow:hidden;background:#000;font-family:"Segoe UI",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;opacity:0;background:
radial-gradient(circle at center,#161616 0%,#080808 45%,#000 100%),
radial-gradient(circle,rgba(255,255,255,.03),transparent 70%);
animation:bgFade 5s ease forwards 2s,bgPulse 10s ease-in-out infinite 7s}
body:after{content:"";position:fixed;inset:0;pointer-events:none;
background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.35)100%)}
.container{text-align:center;animation:breath 10s ease-in-out infinite 8s}
.title,.subtitle{position:relative;display:block;overflow:hidden;color:#fff;white-space:nowrap;opacity:0}
.title{font-size:clamp(34px,4vw,64px);font-weight:500;letter-spacing:.18em;
animation:titleIn 1s ease forwards 7s,glowTitle 6s ease-in-out infinite 8s}
.subtitle{margin-top:6px;font-size:clamp(13px,1.2vw,22px);font-weight:400;letter-spacing:.25em;
animation:subIn 1s ease forwards 7.4s,glowSub 6s ease-in-out infinite 8.4s}
.title:after,.subtitle:after{content:"";position:absolute;top:-20%;left:-160%;width:9%;height:140%;opacity:0;transform:skewX(-20deg);
background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.08),rgba(255,255,255,.95),rgba(255,255,255,.08),rgba(255,255,255,0));filter:blur(2px)}
.title.shimmer:after,.subtitle.shimmer:after{animation:shimmer 1s ease forwards}
@keyframes bgFade{from{opacity:0}to{opacity:1}}
@keyframes bgPulse{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.04);opacity:.65}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.004)}}
@keyframes titleIn{from{opacity:0;transform:translateY(18px);letter-spacing:.4em}to{opacity:1;transform:none;letter-spacing:.18em}}
@keyframes subIn{from{opacity:0;transform:translateY(15px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.25em}}
@keyframes glowTitle{0%,100%{text-shadow:0 0 6px rgba(255,255,255,.06)}50%{text-shadow:0 0 12px rgba(255,255,255,.18),0 0 24px rgba(255,255,255,.08)}}
@keyframes glowSub{0%,100%{text-shadow:0 0 3px rgba(255,255,255,.05)}50%{text-shadow:0 0 8px rgba(255,255,255,.15)}}
@keyframes shimmer{0%{left:-160%;opacity:0}15%{opacity:1}100%{left:160%;opacity:0}}
</style>
</head>
<body>
<div class="container">
<div class="title">TERIMA KASIH</div>
<div class="subtitle">SUDAH MENONTON</div>
</div>
<script>
const t=document.querySelector('.title'),s=document.querySelector('.subtitle');
function play(){
 t.classList.add('shimmer');
 setTimeout(()=>t.classList.remove('shimmer'),1000);
 setTimeout(()=>{
  s.classList.add('shimmer');
  setTimeout(()=>s.classList.remove('shimmer'),1000);
 },500);
 next();
}
function next(){setTimeout(play,20000+Math.random()*15000);}
setTimeout(play,10000);
</script>
</body>
</html>
